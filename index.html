<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffe6e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            width: 300px;
        }
        h2 {
            color: #d63384;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            justify-content: space-around;
            position: relative;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        #yesBtn {
            background-color: #ff4d4d;
            color: white;
        }
        #noBtn {
            background-color: #ccc;
            color: #333;
            position: absolute;
            left: 150px;
            transition: 0.1s;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ကိုယ့်ကို ချစ်လားဟင်? 🥺</h2>
        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">ချစ်တယ်</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">မချစ်ဘူး</button>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function sayYes() {
            document.querySelector('.container').innerHTML = `
                <h2 style="color: #28a745;">ဟီးဟီး သိပါတယ်နော် 🥰❤️</h2>
            `;
        }
    </script>

</body>
</html>
